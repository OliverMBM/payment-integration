spring.application.name=payment-integration
app.core.outbox-dir=outbox

spring.security.user.name=integration-user
spring.security.user.password=integration-pass

spring.datasource.url=jdbc:h2:mem:paymentsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false